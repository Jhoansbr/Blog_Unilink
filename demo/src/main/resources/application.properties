# CONFIGURACIÓN BASE DE DATOS
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.maximum-pool-size=10

# Puerto del servidor
server.port=${PORT:8081}

# Dialecto para MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Mostrar las consultas en consola
spring.jpa.show-sql=true

# Crear o actualizar tablas automáticamente basadas en entidades
spring.jpa.hibernate.ddl-auto=update

# Deshabilitar open-in-view
spring.jpa.open-in-view=false

# Logging para depuración
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=DEBUG
logging.level.org.springframework.security.authentication=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.com.mysql.cj.jdbc=DEBUG

